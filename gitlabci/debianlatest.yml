build:debian:
  stage: build-debian
  resource_group: builddeb
  artifacts:
   expire_in: 90 minutes
   paths:
    - $CI_PROJECT_DIR 
  image: $CONTAINER_CLIENT_IMAGE
  variables:
    OS: "debian"
  script:
    - apt update
    - apt-get -y upgrade
    - apt install --no-install-recommends --no-install-suggests -y curl unzip base-files automake base-passwd
      bash coreutils dash debianutils diffutils dpkg e2fsprogs findutils grep gzip hostname ncurses-base
      libevent-pthreads-* libevent-dev ncurses-bin perl-base sed login sysvinit-utils tar bsdutils
      mount util-linux libc6-dev libc-dev gcc g++ make dpkg-dev autotools-dev debhelper dh-autoreconf
      libclamav-dev libpcre2-dev zlib1g-dev pkg-config libssl-dev git ca-certificates lsb-release
    - cd $CI_PROJECT_DIR && ./autogen.sh && ./configure  '--prefix=/usr' '--enable-clamd=yes' '--with-proxyuser=e2guardian' '--with-proxygroup=e2guardian' '--sysconfdir=/etc' '--localstatedir=/var' '--enable-icap=yes' '--enable-commandline=yes' '--enable-email=yes' '--enable-ntlm=yes' '--mandir=${prefix}/share/man' '--infodir=${prefix}/share/info' '--enable-pcre=yes' '--enable-sslmitm=yes' 'CPPFLAGS=-mno-sse2 -g -O2'
    - make -j 4
    - find $CI_PROJECT_DIR -name ".git" -exec rm -r "{}" +
    - chown -Rf 1161 $CI_BUILDS_DIR

package:debian:
  stage: create-package-debian
  image: $CONTAINER_CLIENT_IMAGE
  artifacts:
   expire_in: 90 minutes
   paths:
    - $CI_PROJECT_DIR 
  variables:
    PACKPATH: "$CI_PROJECT_DIR"
    PACKDST: "$CI_PROJECT_DIR/scripts/debian_package/e2debian_package"
    OS: "debian"
  script: |
    # Package for Debian: inline script (single scalar block to avoid nested arrays)
    PACKPATH="$CI_PROJECT_DIR"
    PACKDST="$CI_PROJECT_DIR/scripts/debian_package/e2debian_package"

    apt update && apt install --no-install-recommends --no-install-suggests -y curl git ca-certificates util-linux binutils libpcre2-8-0 || true
    git clone https://github.com/fredbcode/scripts || true
    # Ensure runtime libs for binary inspection are available
    apt update && apt install -y libpcre2-posix3 libstdc++6 g++-14 gcc-14 || true
    cp ${PACKPATH}/src/e2guardian ${PACKDST}/data/usr/sbin/e2guardian || true
    chmod +x ${PACKDST}/data/usr/sbin/e2guardian || true
    cp -Rf ${PACKPATH}/configs ${PACKDST}/data/etc/e2guardian || true
    mkdir -p ${PACKPATH}/share/e2guardian/languages || true
    cp -Rf ${PACKPATH}/data/languages ${PACKDST}/data/usr/share/e2guardian/ || true
    cp ${PACKPATH}/data/*.gif ${PACKDST}/data/usr/share/e2guardian/ || true
    cp ${PACKPATH}/data/*swf ${PACKDST}/data/usr/share/e2guardian/ || true
    cp ${PACKPATH}/data/scripts/e2guardian.service ${PACKDST}/data/lib/systemd/system || true
    find ${PACKDST}/ -type f -name "Makefil*" -delete || true
    find ${PACKDST}/ -type f -name "*.in" -delete || true
    SIZE=$(stat -c %s ${PACKDST}/data || echo 0) && echo $SIZE && sed -i "s/Installed-Size:.*$/Installed-Size: $SIZE/g" ${PACKDST}/control/control || true

    # replace legacy pcre deps with pcre2
    sed -i "s/libssl3/libssl3/g" ${PACKDST}/control/control || true
    sed -i "s/libevent-pthreads-2.1-6/libevent-pthreads-2.1-7/g" ${PACKDST}/control/control || true
    sed -i "s/libpcre3/libpcre2-8-0/g" ${PACKDST}/control/control || true
    sed -i "s/libpcre2-8-0/libpcre2-8-0, libpcre2-posix3/g" ${PACKDST}/control/control || true

    # determine version
    VFULL=""
    if [ -x "${PACKDST}/data/usr/sbin/e2guardian" ]; then
      VFULL=$(${PACKDST}/data/usr/sbin/e2guardian -v 2>/dev/null | sed -n 1p | cut -d ' ' -f 2 || true)
    fi
    if [ -z "$VFULL" ]; then
      VFULL=$(git -C $CI_PROJECT_DIR rev-parse --short HEAD || echo "unknown")
    fi
    sed -i "s/Version:.*$/Version: $VFULL/g" ${PACKDST}/control/control || true
    cat ${PACKDST}/control/control || true
    echo "export VFULL=$VFULL" >> $CI_PROJECT_DIR/scripts/debian_package/variables || true

    cd ${PACKDST} && cd .. && ./rebuild.sh e2"$OS"_package || true
    find $CI_PROJECT_DIR -name ".git" -exec rm -r "{}" + || true

test:debian:
  stage: test-publish-debian
  image: $CONTAINER_CLIENT_IMAGE
  artifacts:
   name: builddebian
   expire_in: 90 minutes
   paths:
    - $CI_PROJECT_DIR 
  variables:
    PACKPATH: "$CI_PROJECT_DIR"
    PACKDST: "$CI_PROJECT_DIR/scripts/debian_package"
    CERT_DIR: "/etc/e2guardian/private/"
    OS: "debian"
  script:
    - source $CI_PROJECT_DIR/scripts/debian_package/variables
    - echo $VFULL
    - apt update
    - apt install -y openssl curl git lsb-release libevent-pthreads* libtommath* libpcre2-8-0 libssl3 
    - apt install -y openssl curl git lsb-release libevent-pthreads* libtommath* libpcre2-8-0 libpcre2-posix3 libssl3 
    - VERSION=`lsb_release -cs`
    # Diagnostic: show binary and run -v before installing package to capture runtime output
    - |
      BIN="${PACKDST}/e2${OS}_package/data/usr/sbin/e2guardian"
      echo "DIAGNOSTIC: checking binary at $BIN"
      ls -l "$BIN" || true
      file "$BIN" || true
      readelf -h "$BIN" 2>/dev/null || true
      ldd "$BIN" 2>/dev/null || true
      "$BIN" -v > ${CI_PROJECT_DIR}/tmp_e2_v.out 2> ${CI_PROJECT_DIR}/tmp_e2_v.err || true
      echo "--- E2GUARDIAN -v STDOUT ---"
      sed -n '1,200p' ${CI_PROJECT_DIR}/tmp_e2_v.out || true
      echo "--- E2GUARDIAN -v STDERR ---"
      sed -n '1,200p' ${CI_PROJECT_DIR}/tmp_e2_v.err || true
    - cd ${PACKDST} && dpkg -i e2"$OS"_package.deb 
    - sed -i "s/^#sslmitm.*$/sslmitm\ =\ on/" /etc/e2guardian/e2guardianf1.conf && sed -i "s/^#enablessl.*$/enablessl\ =\ on/" /etc/e2guardian/e2guardian.conf && sed -i "s/^RANDFILE\s*=\s*\\\$ENV/#RANDFILE\ =\ \$ENV/" /etc/ssl/openssl.cnf
    - mkdir -p ${CERT_DIR}generatedcerts
    - openssl genrsa 4096 > "${CERT_DIR}ca.key" && openssl req -subj "/C=US" -new -x509 -days 3650 -key "${CERT_DIR}ca.key" -out "${CERT_DIR}ca.pem" && openssl genrsa 4096 > "${CERT_DIR}cert.key"
    - chown --recursive e2guardian:e2guardian ${CERT_DIR}
    - echo "qwant.com" >> /etc/e2guardian/lists/example.group/bannedsitelist
    - e2guardian -N &
    - sleep 5 && export https_proxy=http://localhost:8080 
    - curl -k -o /tmp/test https://www.google.com 
    - curl -k https://www.qwant.com | grep -i e2guardian 
    - unset https_proxy
    - mkdir -p "${CI_COMMIT_BRANCH}" 
    - mv e2"$OS"_package.deb ${CI_COMMIT_BRANCH}/e2"$OS"_"$VERSION"_V"$VFULL"_$(date +%Y%m%d).deb
    - md5sum ${CI_COMMIT_BRANCH}/e2"$OS"_"$VERSION"_V"$VFULL"_$(date +%Y%m%d).deb >  ${CI_COMMIT_BRANCH}/e2"$OS"_"$VERSION"_V"$VFULL"_$(date +%Y%m%d)_md5.txt
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - ssh-add <(echo "$SSH_NOSTROMO_KEY")
    - scp -P 822 -r ${CI_COMMIT_BRANCH} e2git@e2guardian.numsys.eu:/datas/e2/html
    - find $CI_PROJECT_DIR -name ".git" -exec rm -r "{}" +
